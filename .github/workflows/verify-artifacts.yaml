name: Verify Artifacts

# STUB (P1). Verifies the signed + attested artifacts a release produces:
# keyless cosign signature + SLSA build-provenance + SPDX SBOM, on the released
# image (by digest) and the chart bundle, plus fail-closed negative cases
# (tampered blob, wrong identity).
#
# Fill in once the signing-enabled ref of pack-build-image/pack-release is
# released (nebari-dev/.github PR #46). The `echo` lines below are placeholders
# so the stub is valid and non-failing; replace them with real cosign calls and
# the expected certificate identity/issuer for the release workflow's OIDC
# identity. See nebari-dev/.github's verifying-nebari-artifacts.md.

on:
  workflow_dispatch:
    inputs:
      image-ref:
        description: "Image to verify, e.g. ghcr.io/nebari-dev/pack-testbed/app@sha256:..."
        required: true

permissions:
  contents: read
  id-token: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify image signature (keyless)
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          echo "TODO: cosign verify \\"
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
          echo "  --certificate-identity-regexp '^https://github.com/nebari-dev/.github/' \\"
          echo "  \"$IMAGE_REF\""

      - name: Verify provenance + SBOM attestations
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          echo "TODO: cosign verify-attestation --type slsaprovenance ... \"$IMAGE_REF\""
          echo "TODO: cosign verify-attestation --type spdxjson ... \"$IMAGE_REF\""

      - name: Negative cases (must fail closed)
        run: |
          echo "TODO: assert verification FAILS for a tampered blob and a wrong identity."
